packages:
  - app
  - packages/*
  - keeper
  - verifier

# Dependency install scripts stay off unless listed here. esbuild's script checks its platform binary;
# unrs-resolver ships its native binding as an optional dependency and needs no script.
allowBuilds:
  esbuild: true
  unrs-resolver: false
  # Optional native speedups pulled in by the wallet stack (ws, cbw-sdk). Each falls back to JavaScript and none
  # reaches the browser bundle (docs/research/wallet-connect.md section 2).
  bufferutil: false
  keccak: false
  utf-8-validate: false
