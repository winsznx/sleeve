# Extends the default rules. EVM addresses (20 bytes) are public chain data; private keys (32 bytes) still match.
# The only 32-byte values allowed are the three public ERC-1967 storage slot constants, by exact value.
[extend]
useDefault = true

[allowlist]
description = "Public EVM addresses, ERC-1967 slot constants and Uniswap parameter names in research notes and replay data"
regexes = [
  '''\b0x[0-9a-fA-F]{40}\b''',
  '''sqrtPriceLimitX96''',
  '''"[0-9a-f]{40}"''',
  '''0xa3f0ad74e5423aebfd80d3ef4346578335a9a72aeaee59ff6cb3582b35133d50''',
  '''0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc''',
  '''0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103''',
]
