[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
sparse_mode = true
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 1000
seed = "0x5"

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
robinhood = "${FORK_RPC}"

[fmt]
line_length = 120
